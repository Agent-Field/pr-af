config_version: v1
# This is THE PR-AF node. It deliberately shares the root manifest's name: the
# root declares `superseded_by` pointing here, so installing this repo installs
# this package, and a user who already has the Python pr-af gets it replaced in
# place — same name, same node id, same triggers, secrets kept. Installing the
# root as a local path (the documented escape hatch) is the one way to get the
# Python node, and it necessarily takes this name over.
name: pr-af
version: 0.1.0
description: AI-Native Pull Request Review Agent
author: Agent-Field
language: go                            # explicit (also auto-detected from go/go.mod)

entrypoint:
  build: ./cmd/pr-af
  start: bin/pr-af
  healthcheck: /health

agent_node:
  node_id: pr-af
  # 8007 rather than the Python node's 8004: during the changeover both may be
  # running, and triggers resolve by node id, not port.
  default_port: 8007

user_environment:
  required:
    - name: OPENROUTER_API_KEY
      description: LLM provider key (OpenRouter)
      type: secret
      scope: global
    - name: GH_TOKEN
      description: GitHub token (repo scope)
      type: secret
      scope: global
  optional:
    - name: AGENTFIELD_SERVER
      description: Control-plane URL
      default: http://localhost:8080
    - name: AGENTFIELD_API_KEY
      description: Control-plane API key
      type: secret
      scope: global
    - name: PR_AF_PROVIDER
      description: harness provider (aforge | claude-code | codex | gemini | opencode)
      default: aforge
    - name: AGENTFIELD_AFORGE_COMMAND
      description: AForge headless command (exec | do)
      default: exec
    - name: PR_AF_MODEL
      description: harness model
      default: openrouter/moonshotai/kimi-k2.5
    - name: PR_AF_LABEL
      description: GitHub pull-request label that triggers a webhook review
      default: pr-af
    - name: PR_AF_MAX_CONCURRENT_REVIEWERS
      description: optional reviewer concurrency cap for webhook-triggered reviews (minimum 1)
    - name: PR_AF_MAX_REVIEW_DEPTH
      description: optional sub-review depth cap for webhook-triggered reviews (minimum 0)
    - name: PR_AF_MAX_COVERAGE_ITERATIONS
      description: optional coverage iteration cap for webhook-triggered reviews (minimum 1)
    - name: PR_AF_HARNESS_BIN
      description: optional executable override for every harness provider (set to an aforge-v2 binary with PR_AF_PROVIDER=aforge)
    - name: PR_AF_MAX_COST_USD
      description: per-run cost ceiling
      default: "2.0"
    - name: PR_AF_MAX_DURATION_SECONDS
      description: per-run wall-clock ceiling
      default: "3600"
    # Harness CLIs in JSON mode emit events only at completion boundaries, so a
    # long single completion looks silent; the old 120s SDK default killed
    # healthy runs.
    - name: AGENTFIELD_HARNESS_IDLE_SECONDS
      description: harness no-output watchdog window (seconds)
      default: "360"
