config_version: v1            # manifest schema version (omit = legacy v0)
name: pr-af
version: 0.1.0
description: Opens draft pull requests from a task description
author: Agent-Field

# The Go node in go/ is the maintained PR review node: same reasoners, same
# interface, one static binary, no per-node venv to build. Installing this repo
# installs that instead — so `af install https://github.com/Agent-Field/pr-af`
# is the one thing a user has to know, before and after the switch.
#
# go/ declares this same name deliberately, so the switch is a replacement in
# place: same node id, same triggers, node-scoped secrets kept. Only one of the
# two can be installed at a time, which is the point.
#
# This manifest stays here as the redirect, so the Python node is still what
# `python -m pr_af.app` and docker-compose run. The redirect is a git-install
# behaviour only: to install this node deliberately, clone the repo and install
# the checkout as a local path.
superseded_by: https://github.com/Agent-Field/pr-af//go

entrypoint:
  start: python -m pr_af.app
  healthcheck: /health

agent_node:
  node_id: pr-af
  default_port: 8004

user_environment:
  required:
    - name: OPENROUTER_API_KEY
      description: LLM provider key (OpenRouter)
      type: secret
      scope: global
    # pr-af's core loop clones the target repo, pushes a branch, and opens a
    # pull request — all need GitHub write access (see app.py / github/client.py).
    # Required so setup prompts for it up front instead of failing mid-run.
    - name: GH_TOKEN
      description: GitHub token (repo scope) for cloning repos and opening pull requests
      type: secret
      scope: global
  optional:
    - name: AGENTFIELD_SERVER
      description: Control-plane URL
      default: http://localhost:8080
    - name: AGENTFIELD_API_KEY
      description: Control-plane API key (if auth is enabled)
      type: secret
      scope: global
    - name: PR_AF_PROVIDER
      description: Coding-agent harness provider (aforge | claude-code | codex | gemini | opencode)
      default: opencode
    - name: PR_AF_AFORGE_BIN
      description: Optional path to the aforge-v2 binary (defaults to aforge on PATH)
    - name: PR_AF_MODEL
      description: Model the harness uses
      default: openrouter/moonshotai/kimi-k2.5
    - name: PR_AF_LABEL
      description: GitHub pull-request label that triggers a webhook review
      default: pr-af
    - name: PR_AF_MAX_CONCURRENT_REVIEWERS
      description: Optional reviewer concurrency cap for webhook-triggered reviews (minimum 1)
    - name: PR_AF_MAX_REVIEW_DEPTH
      description: Optional sub-review depth cap for webhook-triggered reviews (minimum 0)
    - name: PR_AF_MAX_COVERAGE_ITERATIONS
      description: Optional coverage iteration cap for webhook-triggered reviews (minimum 1)
    - name: PR_AF_MAX_COST_USD
      description: Per-run cost ceiling (USD)
      default: "2.0"
    - name: PR_AF_MAX_DURATION_SECONDS
      description: Per-run wall-clock ceiling (seconds)
      default: "3600"
    # Harness CLIs in JSON mode emit events only at completion boundaries, so a
    # long single completion looks silent; the old 120s SDK default killed
    # healthy runs.
    - name: AGENTFIELD_HARNESS_IDLE_SECONDS
      description: harness no-output watchdog window (seconds)
      default: "360"
