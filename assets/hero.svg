<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" role="img" aria-labelledby="title desc">
  <title id="title">PR-AF top available open-source PR review</title>
  <desc id="desc">Dark technical hero comparing a single-pass AI review with PR-AF's dynamic multi-agent review pipeline and a benchmark proof strip.</desc>
  <defs>
    <radialGradient id="glowTeal" cx="70%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#0f766e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="82%" cy="49%" r="30%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1b"/>
      <stop offset="45%" stop-color="#111315"/>
      <stop offset="100%" stop-color="#090b0f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161a1f" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b0e13" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4db7ae"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06a67"/>
    </marker>
    <style>
      .h1 { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 128px; letter-spacing: 0; fill: #f8fafc; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 60px; letter-spacing: 0; fill: #b8bcc3; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 54px; letter-spacing: 0; fill: #73777d; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 41px; letter-spacing: 0; fill: #a7adb5; }
      .smallBold { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 44px; letter-spacing: 0; fill: #e5e7eb; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 34px; letter-spacing: 0; fill: #aeb6c0; }
      .teal { fill: #4db7ae; }
      .red { fill: #e06a67; }
      .muted { fill: #8c9199; }
      .lineGrey { stroke: #6b7280; stroke-width: 5; fill: none; }
      .lineTeal { stroke: #4db7ae; stroke-width: 5; fill: none; }
      .lineRed { stroke: #e06a67; stroke-width: 5; fill: none; }
      .boxGrey { stroke: #7b8087; stroke-width: 5; fill: #151719; }
      .boxTeal { stroke: #4db7ae; stroke-width: 5; fill: #101c1d; }
      .boxRed { stroke: #e06a67; stroke-width: 5; fill: #211211; }
      .thin { stroke: #646970; stroke-width: 2; fill: none; opacity: 0.55; }
    </style>
  </defs>

  <rect width="2752" height="1536" fill="url(#bg)"/>
  <rect width="2752" height="1536" fill="url(#glowTeal)"/>
  <rect width="2752" height="1536" fill="url(#glowRed)"/>

  <text class="h1" x="84" y="160">Top Available Open-Source PR Review</text>
  <text class="sub" x="84" y="260">Custom strategy from the code, verified findings, public benchmark data.</text>

  <text class="label" x="84" y="398">TRADITIONAL AI REVIEW</text>
  <text class="label teal" x="1460" y="398">PR-AF</text>
  <line x1="1376" y1="350" x2="1376" y2="1238" stroke="#8a8f98" stroke-width="3" opacity="0.72"/>

  <g opacity="0.88">
    <rect class="boxGrey" x="158" y="690" width="116" height="112"/>
    <text class="smallBold" x="188" y="760">diff</text>
    <line class="lineGrey" x1="274" y1="746" x2="406" y2="746" marker-end="url(#arrowGrey)"/>
    <circle cx="688" cy="746" r="276" stroke="#6d7279" stroke-width="7" fill="#151719" opacity="0.86"/>
    <text class="sub muted" x="576" y="772">1 LLM</text>
    <line class="lineGrey" x1="964" y1="746" x2="1068" y2="746" marker-end="url(#arrowGrey)"/>
    <rect class="boxGrey" x="1068" y="690" width="210" height="112"/>
    <text class="small" x="1088" y="760" fill="#e5e7eb">comments</text>
  </g>

  <text class="label red" x="435" y="1128">fixed checklist</text>
  <text class="small" x="351" y="1198">same prompt for every PR</text>

  <g filter="url(#softShadow)">
    <rect class="boxTeal" x="1460" y="690" width="116" height="112"/>
    <text class="smallBold" x="1490" y="760">diff</text>
    <line class="lineTeal" x1="1576" y1="746" x2="1660" y2="746" marker-end="url(#arrowTeal)"/>
    <circle cx="1750" cy="746" r="94" fill="#4db7ae" opacity="0.98"/>
    <text class="smallBold" x="1702" y="760" fill="#0f1720">plan</text>
  </g>

  <g>
    <circle cx="2048" cy="476" r="37" fill="#4db7ae"/>
    <circle cx="2048" cy="582" r="37" fill="#4db7ae"/>
    <circle cx="2048" cy="688" r="37" fill="#4db7ae"/>
    <circle cx="2048" cy="794" r="37" fill="#4db7ae"/>
    <circle cx="2048" cy="900" r="37" fill="#4db7ae"/>
    <line class="lineTeal" x1="1830" y1="698" x2="2010" y2="494" marker-end="url(#arrowTeal)"/>
    <line class="lineTeal" x1="1840" y1="714" x2="2008" y2="594" marker-end="url(#arrowTeal)"/>
    <line class="lineTeal" x1="1845" y1="746" x2="2008" y2="692" marker-end="url(#arrowTeal)"/>
    <line class="lineTeal" x1="1840" y1="778" x2="2008" y2="794" marker-end="url(#arrowTeal)"/>
    <line class="lineTeal" x1="1830" y1="794" x2="2010" y2="882" marker-end="url(#arrowTeal)"/>
    <text class="small" x="2092" y="491">security</text>
    <text class="small" x="2092" y="597">state</text>
    <text class="small" x="2092" y="703">types</text>
    <text class="small" x="2092" y="809">tests</text>
    <text class="small" x="2092" y="915">edge cases</text>

    <line class="lineRed" x1="2082" y1="498" x2="2288" y2="704" marker-end="url(#arrowRed)"/>
    <line class="lineRed" x1="2082" y1="604" x2="2294" y2="722" marker-end="url(#arrowRed)"/>
    <line class="lineRed" x1="2082" y1="692" x2="2298" y2="742" marker-end="url(#arrowRed)"/>
    <line class="lineRed" x1="2082" y1="794" x2="2294" y2="770" marker-end="url(#arrowRed)"/>
    <line class="lineRed" x1="2082" y1="884" x2="2288" y2="788" marker-end="url(#arrowRed)"/>
    <circle cx="2350" cy="746" r="94" fill="#e06a67"/>
    <text class="smallBold" x="2270" y="760" fill="#1b1110">challenge</text>
    <line class="lineRed" x1="2444" y1="746" x2="2528" y2="746" marker-end="url(#arrowRed)"/>
    <rect class="boxGrey" x="2528" y="690" width="142" height="112"/>
    <text class="smallBold" x="2550" y="760">review</text>
  </g>

  <text class="label teal" x="1692" y="1128">custom-built strategy</text>
  <text class="small" x="1638" y="1198">review shape adapts to PR shape</text>

  <g transform="translate(80 1302)">
    <rect x="0" y="0" width="2592" height="126" rx="24" fill="url(#panel)" stroke="#3f4650" stroke-width="2"/>
    <text class="mono" x="42" y="49">PUBLIC BENCHMARK PACKAGE</text>
    <text class="smallBold teal" x="42" y="98">Top available open-source</text>
    <line x1="690" y1="74" x2="804" y2="74" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowGrey)"/>
    <text class="small" x="846" y="98">exact result JSON</text>
    <line x1="1248" y1="74" x2="1362" y2="74" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowGrey)"/>
    <text class="small" x="1404" y="98">judge verdicts</text>
    <line x1="1774" y1="74" x2="1888" y2="74" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowGrey)"/>
    <text class="small" x="1930" y="98">reproducible scripts</text>
  </g>

  <line x1="80" y1="1478" x2="2672" y2="1478" stroke="#8a8f98" stroke-width="2" opacity="0.62"/>
  <text class="small" x="80" y="1530">Open source · Apache 2.0</text>
  <text class="small" x="2422" y="1530">agentfield.ai</text>
</svg>
